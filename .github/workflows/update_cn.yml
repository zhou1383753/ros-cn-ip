name: Generate RouterOS CN IP List

on:
  schedule:
    # 每天 UTC 18:00 执行 (即 北京时间 凌晨 02:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 支持手动触发测试

permissions:
  contents: write # 给予 GitHub Actions 写入仓库文件的权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download IP List and Generate RSC
        run: |
          echo "/ip firewall address-list remove [find list=CN]" > cn.rsc
          curl -s https://www.ipdeny.com/ipblocks/data/aggregated/cn-aggregated.zone | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]+' | while read ip; do
            echo "/ip firewall address-list add list=CN address=$ip" >> cn.rsc
          done

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cn.rsc
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update CN IP list [$(date -u +'%Y-%m-%d')]" && git push)
